<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sustainable Work - Open Repository</title>
    <link rel="stylesheet" href="pages.css">
    <style>
        .control-bar { display: flex; gap: 15px; margin-bottom: 20px; align-items: center; }
        .search-input { padding: 8px; width: 300px; border: 1px solid #ccc; border-radius: 4px; }
        .repo-table { width: 100%; border-collapse: collapse; margin-top: 10px; table-layout: auto; }
        .repo-table th, .repo-table td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        .repo-table th { background-color: #f4f4f4; user-select: none; }
        
        /* Highlight cells to visually prompt users that they are interactive fields */
        .editable-cell { background-color: #fffde7; outline: none; }
        .editable-cell:focus { background-color: #fff9c4; border: 1px solid #fbc02d; }
        
        .save-btn { background: #007bff; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .repo-link { color: #007bff; text-decoration: underline; font-weight: bold; }
    </style>
</head>
<body>

    <h2>Sustainable Work Open Repository</h2>
    <p style="color: #666; font-style: italic;">💡 Click into any yellow cell to edit data inline, then click "Save Row" to update the master spreadsheet.</p>

    <div class="control-bar">
        <input type="text" id="searchBox" class="search-input" placeholder="Search entries dynamically...">
        <select id="typeFilter" class="search-input" style="width: 180px;">
            <option value="">All Categories</option>
            <option value="publication">Publications</option>
            <option value="survey">Surveys</option>
        </select>
    </div>

    <table class="repo-table">
        <thead>
            <tr id="tableHeaders">
                <!-- Autogenerated spreadsheet headers go here -->
            </tr>
        </thead>
        <tbody id="repoBody">
            <tr><td colspan="100%">Connecting to repository spreadsheet streams...</td></tr>
        </tbody>
    </table>

    <script src="repositories.js"></script>
</body>
</html>
